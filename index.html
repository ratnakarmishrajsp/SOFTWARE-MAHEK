<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mahekh ERP - D2C Perfume & Attar Business Suite</title>
    <meta name="description" content="Production-ready D2C Perfume & Attar ERP software with real-time P&L tracking, actual RTO reconciliation, ad spend analytics, and stock management." />
    
    <!-- Preconnect to Google Fonts for Fast DNS resolution -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>

    <style>
      /* Ultra-fast 0ms preloader styles */
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root:empty::before {
        content: '';
        width: 44px;
        height: 44px;
        border: 4px solid rgba(245, 158, 11, 0.2);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      #root:empty::after {
        content: '🌸 MAHEKH ERP SUITE • LOADING...';
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: #f59e0b;
        text-transform: uppercase;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <script>
      // 3.5s Fail-safe: Automatically present recovery button if browser cache or network stalls script loading
      window.__MAHEKH_MOUNTED__ = false;
      setTimeout(function() {
        var root = document.getElementById('root');
        if (!window.__MAHEKH_MOUNTED__ && root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#020617;color:#f8fafc;font-family:sans-serif;text-align:center;padding:24px;"><div style="font-size:40px;margin-bottom:12px;">💧</div><h3 style="font-size:18px;font-weight:bold;color:#f59e0b;margin-bottom:8px;">Mahekh ERP — Quick Refresh</h3><p style="font-size:12px;color:#94a3b8;max-width:320px;margin-bottom:20px;line-height:1.5;">Browser cache has updated to the latest version. Click below to load instantly.</p><button onclick="window.location.reload(true)" style="background:linear-gradient(to right, #f59e0b, #d97706);color:#020617;border:none;padding:12px 28px;border-radius:14px;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 10px 25px rgba(245,158,11,0.3);">⚡ Load Latest ERP Version</button></div>';
        }
      }, 3500);
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-800 dark:selection:text-amber-200 min-h-screen transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
